<body data-page="test">
    <div id="app">
        <header>
            <a class="logo" href="/dashboard/">
                <img class="logo-icon" src="/assets/images/logo-mark.svg" alt=""> 평가원기출VOCA
            </a>
            <nav aria-label="주요 메뉴">
                <a href="/generator/" data-route="/generator/">시험지만들기</a>
                <a href="/test/" data-route="/test/">온라인 테스트</a>
                <a href="/cards/" data-route="/cards/">플래시카드</a>
                <a href="/mypage/" data-route="/mypage/">마이페이지</a>
            </nav>
        </header>

        <main class="test-main">
            <h1 style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;">온라인 테스트</h1>
            <div class="test-stack">
                <section id="test-setup-view" class="card hidden">
                    <h2>온라인 테스트</h2>

                    <div class="config-group">
                        <h3>교재 선택</h3>
                        <div id="book-options" class="test-type-options">
                            <div class="test-type-option active" data-book="basic">
                                <div class="label">
                                    <span class="label-main">베이직</span>
                                    <span class="label-sub">basic</span>
                                </div>
                            </div>
                            <div class="test-type-option" data-book="advanced">
                                <div class="label">
                                    <span class="label-main">어드밴스드</span>
                                    <span class="label-sub">advanced</span>
                                </div>
                            </div>
                            <div class="test-type-option" data-book="etymology">
                                <div class="label">
                                    <span class="label-main">어원편</span>
                                    <span class="label-sub">etymology</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="test-setup-layout">
                        <div class="test-setup-scope-column">
                            <div class="config-group test-scope-group">
                                <div class="test-scope-toolbar">
                                    <h3>범위 선택</h3>
                                    <div id="include-derivatives-group" class="toggle-option test-scope-derivatives hidden">
                                        <span>파생어 포함</span>
                                        <label class="switch">
                                            <input type="checkbox" id="include-derivatives-toggle">
                                            <span class="slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <p id="test-scope-summary" class="summary-text" aria-live="polite"></p>
                                <div id="test-toc-checklist" class="toc-checklist"></div>
                            </div>
                        </div>

                        <div class="test-setup-controls-column">
                            <div class="test-controls-cluster">
                                <div id="chapter-group" class="config-group hidden">
                                    <h3>챕터 선택 (어원편)</h3>
                                    <div id="chapter-options" class="test-type-options chapter-type-options"></div>
                                </div>

                                <div class="config-group">
                                    <h3>시험 유형</h3>
                                    <div id="exam-type-options" class="test-type-options">
                                        <div class="test-type-option active" data-exam-type="E2K">
                                            <div class="label">
                                                <span class="label-main">ENG → KOR</span>
                                            </div>
                                        </div>
                                        <div class="test-type-option" data-exam-type="K2E">
                                            <div class="label">
                                                <span class="label-main">KOR → ENG</span>
                                                <span class="label-sub">한국어 → 영어</span>
                                            </div>
                                        </div>
                                        <div class="test-type-option" data-exam-type="MIXED">
                                            <div class="label">
                                                <span class="label-main">MIXED</span>
                                                <span class="label-sub">혼합</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-grid test-setup-inline">
                                    <div class="config-group">
                                        <h3>문항 수</h3>
                                        <div class="input-group">
                                            <input type="number" id="test-question-count" value="0" min="1" max="200" step="1">
                                            <span>개</span>
                                        </div>
                                    </div>
                                    <div class="config-group">
                                        <h3>시험 시간</h3>
                                        <div class="input-group">
                                            <input type="number" id="test-time-limit" value="0" min="0" step="0.5" readonly>
                                            <span>분</span>
                                        </div>
                                    </div>
                                    <div class="config-group test-inline-shuffle">
                                        <h3>문항 순서</h3>
                                        <div class="toggle-option">
                                            <span>무작위 출제</span>
                                            <label class="switch">
                                                <input type="checkbox" id="test-shuffle-toggle" checked>
                                                <span class="slider"></span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="button-primary" id="test-start-btn" disabled>시험 시작</button>
                </section>

                <section id="test-run-view" class="card hidden">
                    <div class="toc-title-row">
                        <h2 id="test-progress">1 / 1</h2>
                        <div class="test-run-meta">
                            <button type="button" class="test-mini-btn" id="test-pronounce-btn">영어 발음 듣기</button>
                            <div id="test-remaining-time" class="version">00:00</div>
                        </div>
                    </div>
                    <h3 id="test-question-prompt" class="test-prompt"></h3>
                    <div id="test-choice-list" class="toc-checklist"></div>
                    <div class="test-actions">
                        <button type="button" class="button-primary" id="test-submit-btn">시험 제출하기</button>
                    </div>
                </section>

                <section id="test-result-view" class="card hidden">
                    <h2>채점 결과</h2>
                    <p id="result-headline" class="subtitle"></p>
                    <div id="result-metrics" class="test-metrics"></div>

                    <div class="config-group">
                        <h3>정답 리뷰</h3>
                        <div id="result-review-list-correct" class="test-review-list"></div>
                    </div>

                    <div class="config-group">
                        <h3>오답 리뷰</h3>
                        <div id="result-review-list-wrong" class="test-review-list"></div>
                    </div>

                    <div class="test-actions">
                        <button type="button" class="button-primary" id="retry-wrong-btn">오답만 다시 풀기</button>
                        <button type="button" class="button-primary" id="retry-scope-btn">같은 범위 다시 풀기</button>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div id="toast-container" aria-live="polite" aria-atomic="true" class="toast-container" role="status"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

</body>
