<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">Oxbridge Partners logo</title>
  <desc id="desc">Centered two-line Oxbridge Partners wordmark with transparent background.</desc>
  <style>
    .ox {
      font-family: "Playfair Display", "Times New Roman", serif;
      font-size: 88px;
      font-weight: 600;
      letter-spacing: 0.18em;
    }

    .partners {
      font-family: "Playfair Display", "Times New Roman", serif;
      font-size: 58px;
      font-weight: 500;
      letter-spacing: 0.26em;
    }
  </style>
  <text class="ox" x="50%" y="94" text-anchor="middle" dominant-baseline="middle" fill="#111111">OXBRIDGE</text>
  <text class="partners" x="50%" y="166" text-anchor="middle" dominant-baseline="middle" fill="#111111">PARTNERS</text>
</svg>
