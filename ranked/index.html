<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <meta http-equiv="refresh" content="0; url=/mypage/">
    <title>마이페이지로 이동 중 | 평가원기출VOCA</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            background: linear-gradient(180deg, #eef4ff 0%, #eaf1fb 100%);
            color: #0f172a;
            font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        main {
            width: min(100% - 2rem, 480px);
            display: grid;
            justify-items: center;
            gap: 0.55rem;
            padding: 1.3rem;
            border: 1px solid #dbe4f2;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.96);
            text-align: center;
            box-shadow: 0 22px 46px -34px rgba(15, 23, 42, 0.72);
        }

        .spinner {
            width: 2.1rem;
            height: 2.1rem;
            border-radius: 999px;
            border: 3px solid #dbe7f8;
            border-top-color: #1d4ed8;
            animation: spin 780ms linear infinite;
        }

        strong {
            font-size: 1.02rem;
        }

        span {
            color: #475569;
            font-size: 0.9rem;
            line-height: 1.45;
        }

        a {
            color: #1d4ed8;
            font-weight: 700;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>window.location.replace('/mypage/');</script>
</head>
<body>
    <main role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <strong>마이페이지로 이동 중입니다</strong>
        <span>불러오는 중입니다. 잠시 기다려주세요.</span>
        <a href="/mypage/">바로 이동하기</a>
    </main>
</body>
</html>
